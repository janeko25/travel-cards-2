<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel with me</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="bg-sky-100 p-4">
    <a href="#" class="text-xl font-semibold text-gray-900">
      Travel with me
    </a>
  </header>
  <main class="mx-auto max-w-6xl p-4">
    <h1 class="mb-6 text-center text-3xl font-bold">
      Місця для подорожей
    </h1>
    <section class="grid grid-cols-1 gap-6 md:grid-cols-3">
      <div class="rounded-lg border border-gray-200">
        <img src="./img/tailwind.jpg" class="h-56 w-full object-cover" alt="Гірське озеро">
        <div class="p-4">
          <h2 class="text-xl font-semibold">Гірське озеро</h2>
          <p>Спокійне місце серед гір, де можна відпочити й насолодитися краєвидами</p>
          <button class="rounded bg-blue-600 px-4 py-2 text-white" type="button">
            Дізнатися більше
          </button>
        </div>
      </div>
      <div class="rounded-lg border border-gray-200">
        <img src="./img/tailwind2.jpg" class="h-56 w-full object-cover" alt="Альпійські вершини">
        <div class="p-4">
          <h2 class="text-xl font-semibold">Альпійські вершини</h2>
          <p>Відкрий для себе чисте повітря, високі гори та прозору воду</p>
          <button class="rounded bg-blue-600 px-4 py-2 text-white" type="button">
            Дізнатися більше
          </button>
        </div>
      </div>
      <div class="rounded-lg border border-gray-200">
        <img src="./img/tailwind3.avif" class="h-56 w-full object-cover" alt="Морський берег">
        <div class="p-4">
          <h2 class="text-xl font-semibold">Морський берег</h2>
          <p>Відпочинь біля моря, прогуляйся узбережжям і зустрінь захід сонця</p>
          <button class="rounded bg-blue-600 px-4 py-2 text-white" type="button">
            Дізнатися більше
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
